<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI 영상책 홍보 기획실</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #e0533d;
    }
    body { font-family: 'Noto Sans KR', -apple-system, sans-serif; }
    .sidebar { background-color: #fbf8f6; }
    .sidebar-nav li a { font-size: 14px; }
    .markdown-section { max-width: 1100px; }
    .markdown-section table { display: table; width: 100%; font-size: 13.5px; }
    .markdown-section a { color: #e0533d; text-decoration: underline; }
    .app-name-link { font-weight: bold; font-size: 17px !important; }
    .app-nav li a { font-size: 15px; font-weight: 500; }
    .app-nav li.active > a { color: #e0533d; border-bottom: 2px solid #e0533d; }
    .markdown-section blockquote {
      border-left: 4px solid #e0533d;
      background: #fdf3f1;
      color: #444;
    }
    .markdown-section h2 {
      border-bottom: 2px solid #f0e4e0;
      padding-bottom: 8px;
      margin-top: 48px;
    }

    /* ===== 사례 썸네일 갤러리 ===== */
    .case-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
      margin: 28px 0 40px;
    }
    .case-card {
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      display: flex;
      flex-direction: column;
      transition: transform .15s, box-shadow .15s;
    }
    .case-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(0,0,0,.13);
    }
    .case-card .shot {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
    }
    .case-card .shot img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .case-card .views {
      position: absolute;
      right: 8px; bottom: 8px;
      background: rgba(0,0,0,.82);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: -.3px;
    }
    .case-card .rank {
      position: absolute;
      left: 8px; top: 8px;
      background: #e0533d;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .case-card .rank.warn { background: #b0342a; }
    .case-card .rank.good { background: #2e7d32; }
    .case-card .body { padding: 11px 13px 14px; flex: 1; display: flex; flex-direction: column; }
    .case-card .ch {
      font-size: 11.5px;
      color: #999;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .case-card .ti {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      color: #222;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .case-card .hook {
      font-size: 12px;
      line-height: 1.5;
      color: #555;
      background: #faf7f5;
      border-left: 3px solid #e0533d;
      padding: 7px 9px;
      border-radius: 0 4px 4px 0;
      margin-top: auto;
    }
    .case-card .hook b { color: #c8402c; }

    .sec-note {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13.5px;
      margin: 20px 0;
    }

    /* 쇼츠 스크립트 블록 */
    .markdown-section pre[data-lang="script"] { background: #1e1e28; }
  </style>
</head>
<body>
  <div id="app">로딩 중...</div>
  <script>
    window.$docsify = {
      name: '📕 AI 영상책 홍보 기획실',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      basePath: './',
      search: { placeholder: '검색...', noData: '결과 없음', depth: 3 },
      plugins: [
        function openLinksInNewTab(hook) {
          hook.doneEach(function () {
            document.querySelectorAll('.markdown-section a:not([target])').forEach(function (a) {
              var href = a.getAttribute('href') || '';
              if (href.indexOf('#/') === 0) return;
              a.setAttribute('target', '_blank');
              a.setAttribute('rel', 'noopener noreferrer');
            });
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
