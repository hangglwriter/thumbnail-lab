<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>썸네일 랩 - 인기 유튜브 썸네일 영감</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, "Noto Sans KR", "Segoe UI", sans-serif; }
  .thumb-card { transition: transform .15s ease, box-shadow .15s ease; }
  .thumb-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,.4); }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

<header class="sticky top-0 z-20 bg-gray-900/95 backdrop-blur border-b border-gray-800">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <span class="text-amber-400">🎨</span>
      썸네일 랩
      <span class="text-xs text-gray-500 font-normal">유튜브 인기 썸네일 영감</span>
    </h1>
    <div class="flex-1"></div>
    <input id="search" type="text" placeholder="🔍 제목·채널 검색"
           class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm w-full sm:w-64 focus:outline-none focus:border-amber-400">
    <select id="sort" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm">
      <option value="views">조회수순</option>
      <option value="date">최신순</option>
    </select>
    <button id="favOnly" class="bg-gray-800 border border-gray-700 hover:border-amber-400 rounded-lg px-3 py-1.5 text-sm">
      ★ 즐겨찾기만
    </button>
  </div>

  <!-- 1차: 카테고리 -->
  <div class="max-w-7xl mx-auto px-4 pb-2 flex flex-wrap gap-2 items-center" id="categoryTabs"></div>
  <!-- 2차: 선택된 카테고리의 세부 키워드 -->
  <div class="max-w-7xl mx-auto px-4 pb-3 flex flex-wrap gap-2 items-center" id="keywordTabs"></div>

  <!-- 필터바: 지역 / 포맷 / 패턴 -->
  <div class="max-w-7xl mx-auto px-4 pb-3 flex flex-wrap gap-2 items-center text-xs" id="filterBar">
    <span class="text-gray-500">지역:</span>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="region" data-value="">🌐 전체</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="region" data-value="kr">🇰🇷 한국만</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="region" data-value="global">🌎 해외만</button>
    <span class="text-gray-700 mx-1">|</span>
    <span class="text-gray-500">포맷:</span>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="format" data-value="">전체</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="format" data-value="long">롱폼</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="format" data-value="shorts">쇼츠</button>
    <span class="text-gray-700 mx-1">|</span>
    <span class="text-gray-500">패턴:</span>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="pattern" data-value="">전체</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="pattern" data-value="대비">대비</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="pattern" data-value="충격">충격</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="pattern" data-value="질문">질문</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="pattern" data-value="총정리">총정리</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="pattern" data-value="결과">결과</button>
    <button class="filter-btn chip bg-gray-800 border border-gray-700" data-key="pattern" data-value="정보">정보</button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div id="status" class="text-sm text-gray-500 mb-4">로딩 중...</div>
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  <div id="empty" class="hidden text-center text-gray-500 py-12">표시할 영상이 없습니다.</div>
</main>

<footer class="border-t border-gray-800 mt-12">
  <div class="max-w-7xl mx-auto px-4 py-4 text-xs text-gray-600 flex flex-wrap items-center gap-3">
    <span>썸네일 랩 - 행글라이터</span>
    <span class="text-gray-800">|</span>
    <span>썸네일 출처: 각 채널 저작권</span>
    <span class="text-gray-800">|</span>
    <span id="lastUpdate"></span>
  </div>
</footer>

<script>
const state = {
  keywords: [],
  activeCategory: null,   // 현재 선택된 카테고리 slug
  activeKeyword: null,    // null이면 카테고리 통합 보기
  allVideos: [],
  cache: {},              // slug -> videos (중복 fetch 방지)
  search: '',
  sort: 'views',
  favOnly: false,
  filters: { region: '', format: '', pattern: '' },
  favs: new Set(JSON.parse(localStorage.getItem('thumblab_favs') || '[]')),
};

const CATEGORY_LABELS = {
  'ai-video':  { label: '🎬 AI 영상',     color: 'text-rose-300',    btn: 'border-rose-700/50 text-rose-200' },
  'ai-image':  { label: '🖼 AI 이미지',   color: 'text-violet-300',  btn: 'border-violet-700/50 text-violet-200' },
  'vibecoding':{ label: '💻 바이브코딩',  color: 'text-cyan-300',    btn: 'border-cyan-700/50 text-cyan-200' },
  'ai-model':  { label: '🤖 AI 모델·도구',color: 'text-emerald-300', btn: 'border-emerald-700/50 text-emerald-200' },
  'books':     { label: '📚 책·자기계발', color: 'text-amber-300',   btn: 'border-amber-700/50 text-amber-200' },
  'shorts':    { label: '🎞 쇼츠 벤치마킹',color: 'text-pink-300',    btn: 'border-pink-700/50 text-pink-200' },
  'story':     { label: '📖 스토리·낭독', color: 'text-indigo-300',  btn: 'border-indigo-700/50 text-indigo-200' },
};
const CATEGORY_ORDER = ['ai-video', 'ai-image', 'vibecoding', 'ai-model', 'books', 'shorts', 'story'];

function fmtNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '만';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + '천';
  return (n || 0).toLocaleString();
}
function fmtDuration(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}
function fmtDate(d) {
  if (!d || d.length < 8) return '';
  return d.slice(0, 4) + '.' + d.slice(4, 6) + '.' + d.slice(6, 8);
}
// 한국 영상 판별: 제목/채널에 한글이 있으면 한국
function isKorean(v) {
  return /[가-힣]/.test((v.title || '') + ' ' + (v.channel || ''));
}

async function fetchVids(slug) {
  if (state.cache[slug]) return state.cache[slug];
  try {
    const r = await fetch('data/' + encodeURIComponent(slug) + '.json');
    if (!r.ok) return [];
    const j = await r.json();
    const vids = j.videos || [];
    state.cache[slug] = vids;
    state.cache['__updated__' + slug] = j.updated || '';
    return vids;
  } catch (e) { return []; }
}

async function loadKeywords() {
  try {
    const r = await fetch('data/keywords.json');
    if (!r.ok) throw new Error('no index');
    const j = await r.json();
    state.keywords = j.keywords || [];
    // 첫 카테고리(순서상 데이터 있는 첫 번째) 통합 보기로 시작
    const firstCat = CATEGORY_ORDER.find(c => state.keywords.some(k => k.category === c && k.count > 0))
      || (state.keywords[0] && state.keywords[0].category);
    if (firstCat) await loadCategory(firstCat);
    else document.getElementById('status').textContent = '데이터 없음. scripts/collect.py 실행 필요.';
  } catch (e) {
    document.getElementById('status').textContent = '키워드 인덱스 로드 실패: ' + e.message;
  }
}

// 카테고리 통합 보기 (하위 키워드 전부 합치고 중복 제거)
async function loadCategory(cat) {
  state.activeCategory = cat;
  state.activeKeyword = null;
  document.getElementById('status').textContent = '로딩...';
  const ks = state.keywords.filter(k => (k.category || '') === cat && k.count > 0);
  const seen = new Set(), out = [];
  for (const k of ks) {
    const vids = await fetchVids(k.slug);
    for (const v of vids) {
      if (seen.has(v.id)) continue;
      seen.add(v.id);
      v.__slug = k.slug;
      v.__keyword = k.keyword;
      out.push(v);
    }
  }
  state.allVideos = out;
  const meta = CATEGORY_LABELS[cat] || { label: cat };
  document.getElementById('lastUpdate').textContent = meta.label + ' 통합 (' + out.length + '건, 키워드 ' + ks.length + '개)';
  renderTabs();
  render();
}

// 전체 쇼츠 가상 보기 (모든 키워드의 format=shorts 통합)
async function loadAllShorts() {
  state.activeCategory = '__all_shorts__';
  state.activeKeyword = null;
  document.getElementById('status').textContent = '로딩...';
  const seen = new Set(), out = [];
  for (const k of state.keywords) {
    if (!k.count) continue;
    const vids = await fetchVids(k.slug);
    for (const v of vids) {
      if (v.format === 'shorts' && !seen.has(v.id)) {
        seen.add(v.id); v.__slug = k.slug; v.__keyword = k.keyword; out.push(v);
      }
    }
  }
  state.allVideos = out;
  document.getElementById('lastUpdate').textContent = '🎬 전체 쇼츠 통합 (' + out.length + '건)';
  renderTabs();
  render();
}

// 단일 키워드 보기
async function loadKeyword(slug) {
  const k = state.keywords.find(x => x.slug === slug);
  state.activeKeyword = slug;
  if (k) state.activeCategory = k.category;
  document.getElementById('status').textContent = '로딩...';
  const vids = await fetchVids(slug);
  for (const v of vids) { v.__slug = slug; v.__keyword = k ? k.keyword : slug; }
  state.allVideos = vids;
  document.getElementById('lastUpdate').textContent =
    '갱신: ' + (state.cache['__updated__' + slug] || '-') + ' / 키워드 "' + (k ? k.keyword : slug) + '"';
  renderTabs();
  render();
}

function renderTabs() {
  // ---- 1차: 카테고리 ----
  const catEl = document.getElementById('categoryTabs');
  catEl.innerHTML = '<span class="text-xs text-gray-500 mr-1">카테고리</span>';
  const present = CATEGORY_ORDER.filter(c => state.keywords.some(k => k.category === c && k.count > 0));
  for (const cat of present) {
    const meta = CATEGORY_LABELS[cat];
    const n = state.keywords.filter(k => k.category === cat && k.count > 0).length;
    const active = state.activeCategory === cat;
    const b = document.createElement('button');
    b.textContent = meta.label + ' (' + n + ')';
    b.className = 'chip border text-[12px] py-1 px-2.5 ' + (active
      ? 'bg-amber-500 text-gray-900 border-amber-400 font-bold'
      : 'bg-gray-800 ' + meta.btn + ' hover:border-amber-400');
    b.onclick = () => loadCategory(cat);
    catEl.appendChild(b);
  }
  // 전체 쇼츠 가상 탭
  const sb = document.createElement('button');
  sb.textContent = '🎬 전체 쇼츠';
  sb.title = '모든 카테고리의 쇼츠 통합';
  const sActive = state.activeCategory === '__all_shorts__';
  sb.className = 'chip border text-[12px] py-1 px-2.5 ml-1 ' + (sActive
    ? 'bg-pink-500 text-gray-900 border-pink-400 font-bold'
    : 'bg-gray-800 border-pink-700/50 text-pink-300 hover:border-pink-400');
  sb.onclick = () => loadAllShorts();
  catEl.appendChild(sb);

  // ---- 2차: 선택된 카테고리의 세부 키워드 ----
  const kwEl = document.getElementById('keywordTabs');
  kwEl.innerHTML = '';
  if (!state.activeCategory || state.activeCategory === '__all_shorts__') return;
  const meta = CATEGORY_LABELS[state.activeCategory];
  kwEl.innerHTML = `<span class="text-xs ${meta ? meta.color : 'text-gray-400'} font-semibold mr-1">세부 주제</span>`;

  // [전체] = 카테고리 통합
  const allBtn = document.createElement('button');
  allBtn.textContent = '전체';
  const allActive = state.activeKeyword === null;
  allBtn.className = 'chip border ' + (allActive
    ? 'bg-amber-500 text-gray-900 border-amber-400 font-semibold'
    : 'bg-gray-800 border-gray-700 hover:border-amber-400');
  allBtn.onclick = () => loadCategory(state.activeCategory);
  kwEl.appendChild(allBtn);

  const ks = state.keywords
    .filter(k => k.category === state.activeCategory && k.count > 0)
    .sort((a, b) => b.count - a.count);
  for (const k of ks) {
    const b = document.createElement('button');
    b.textContent = k.keyword + ' (' + k.count + ')';
    b.className = 'chip border ' + (k.slug === state.activeKeyword
      ? 'bg-amber-500 text-gray-900 border-amber-400 font-semibold'
      : 'bg-gray-800 border-gray-700 hover:border-amber-400');
    b.onclick = () => loadKeyword(k.slug);
    kwEl.appendChild(b);
  }
}

function render() {
  let videos = state.allVideos.slice();

  // 로컬 숨김 필터
  const hidden = new Set(JSON.parse(localStorage.getItem('thumblab_hidden') || '[]'));
  if (hidden.size > 0) videos = videos.filter(v => !hidden.has(v.id));

  // 지역 필터
  if (state.filters.region === 'kr') videos = videos.filter(isKorean);
  else if (state.filters.region === 'global') videos = videos.filter(v => !isKorean(v));

  if (state.search) {
    const q = state.search.toLowerCase();
    videos = videos.filter(v =>
      (v.title || '').toLowerCase().includes(q) || (v.channel || '').toLowerCase().includes(q)
    );
  }
  if (state.favOnly) videos = videos.filter(v => state.favs.has(v.id));
  if (state.filters.format) videos = videos.filter(v => v.format === state.filters.format);
  if (state.filters.pattern) videos = videos.filter(v => v.analysis?.copy_pattern === state.filters.pattern);

  if (state.sort === 'views') videos.sort((a, b) => (b.views || 0) - (a.views || 0));
  else if (state.sort === 'date') videos.sort((a, b) => (b.upload_date || '').localeCompare(a.upload_date || ''));

  // 지역 통계
  const krN = state.allVideos.filter(isKorean).length;
  const glN = state.allVideos.length - krN;
  document.getElementById('status').innerHTML =
    `${videos.length}개 표시 <span class="text-gray-600">(전체 ${state.allVideos.length} · 🇰🇷${krN} · 🌎${glN})</span>`;
  document.getElementById('empty').classList.toggle('hidden', videos.length > 0);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const v of videos) grid.appendChild(cardEl(v));
}

function cardEl(v) {
  const isFav = state.favs.has(v.id);
  const a = v.analysis || {};
  const card = document.createElement('div');
  card.className = 'thumb-card bg-gray-900 rounded-xl overflow-hidden border border-gray-800 relative';
  const showKwTag = state.activeKeyword === null; // 통합 보기일 때만 키워드 라벨
  card.innerHTML = `
    <button class="delete-btn" data-id="${v.id}" title="삭제 (토큰 필요)">✕</button>
    ${v.added_manually ? `<span class="absolute top-1.5 left-1.5 bg-amber-500/90 text-gray-900 text-[10px] px-1.5 py-0.5 rounded font-bold z-[4]">📥 수동</span>` : ''}
    <a href="${v.url}" target="_blank" rel="noopener" class="block relative aspect-video bg-gray-800">
      ${v.thumb || v.thumbnail_url ? `<img src="${v.thumb || v.thumbnail_url}" alt="" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">` : `<div class="flex items-center justify-center h-full text-gray-600 text-xs">no thumb</div>`}
      ${v.duration ? `<span class="absolute bottom-1 right-1 bg-black/70 text-white text-xs px-1.5 py-0.5 rounded">${fmtDuration(v.duration)}</span>` : ''}
      ${v.format === 'shorts' ? `<span class="absolute top-1 left-1 bg-red-500/90 text-white text-[10px] px-1.5 py-0.5 rounded">SHORTS</span>` : ''}
      ${isKorean(v) ? `<span class="absolute bottom-1 left-1 bg-blue-600/90 text-white text-[10px] px-1.5 py-0.5 rounded">🇰🇷 한국</span>` : ''}
    </a>
    <div class="p-3 flex flex-col gap-1.5">
      <div class="flex items-start justify-between gap-2">
        <a href="${v.url}" target="_blank" rel="noopener" class="text-sm font-medium leading-snug hover:text-amber-300 line-clamp-2">${escape(v.title)}</a>
        <button class="fav-btn text-lg leading-none ${isFav ? 'text-amber-400' : 'text-gray-600 hover:text-amber-400'}" data-id="${v.id}" title="즐겨찾기">★</button>
      </div>
      <div class="text-xs text-gray-400 truncate">${escape(v.channel || '-')}</div>
      <div class="text-xs text-gray-500 flex items-center gap-2 flex-wrap">
        <span>👁 ${fmtNum(v.views)}</span>
        <span>📅 ${fmtDate(v.upload_date)}</span>
        ${showKwTag && v.__keyword ? `<span class="text-amber-400/70">🏷 ${escape(v.__keyword)}</span>` : ''}
      </div>
      ${renderAnalysis(a, v.id)}
      ${renderScriptToggle(v)}
    </div>
  `;
  card.querySelector('.fav-btn').onclick = (e) => { e.preventDefault(); toggleFav(v.id); };
  const delBtn = card.querySelector('.delete-btn');
  if (delBtn) {
    delBtn.onclick = async (e) => {
      e.preventDefault(); e.stopPropagation();
      const admin = window.thumblabAdmin;
      if (!admin) { alert('admin.js 로드 안 됨. 페이지 새로고침'); return; }
      const targetSlug = v.__slug || state.activeKeyword;
      if (!admin.hasToken()) {
        if (confirm('영구 삭제하려면 GitHub 토큰이 필요해.\n지금 입력할래?\n(취소 누르면 이 카드만 임시 숨김)')) {
          admin.promptToken(); return;
        } else {
          const hidden = JSON.parse(localStorage.getItem('thumblab_hidden') || '[]');
          if (!hidden.includes(v.id)) hidden.push(v.id);
          localStorage.setItem('thumblab_hidden', JSON.stringify(hidden));
          render(); return;
        }
      }
      admin.deleteVideo(targetSlug, v.id);
    };
  }
  return card;
}

function renderAnalysis(a, vid) {
  if (!a || Object.keys(a).length === 0) {
    return `<div class="text-[10px] text-gray-600 italic">분석 전 (analyze.py 실행)</div>`;
  }
  const colorChips = (a.colors || []).map(c =>
    `<span class="w-3 h-3 rounded-full border border-gray-700" style="background:${c}" title="${c}"></span>`
  ).join('');
  const patternColors = {
    '대비': 'bg-blue-900 text-blue-200', '충격': 'bg-red-900 text-red-200',
    '질문': 'bg-purple-900 text-purple-200', '총정리': 'bg-green-900 text-green-200',
    '결과': 'bg-amber-900 text-amber-200', '정보': 'bg-gray-800 text-gray-300',
  };
  const patternCls = patternColors[a.copy_pattern] || 'bg-gray-800 text-gray-300';
  return `
    <div class="flex flex-wrap items-center gap-1.5 mt-1">
      ${a.copy_pattern ? `<span class="chip ${patternCls}">${a.copy_pattern}</span>` : ''}
      ${a.main_visual ? `<span class="chip bg-gray-800 text-gray-300">${a.main_visual}</span>` : ''}
      ${a.person_position && a.person_position !== '없음' ? `<span class="chip bg-gray-800 text-gray-400">인물:${a.person_position}</span>` : ''}
      <span class="flex gap-1 ml-auto">${colorChips}</span>
    </div>
    ${a.hook_words?.length ? `<div class="text-[11px] text-amber-300/80 mt-0.5">키워드: ${a.hook_words.join(' · ')}</div>` : ''}
    ${a.main_copy ? `<div class="text-[11px] text-gray-400 mt-0.5 line-clamp-2 italic">"${escape(a.main_copy)}"</div>` : ''}
  `;
}

function renderScriptToggle(v) {
  const s = v.script_analysis;
  if (!s) return '';
  const uid = 'sc-' + v.id;
  return `
    <details class="mt-1 border-t border-gray-800 pt-1.5" id="${uid}">
      <summary class="text-xs text-amber-300/90 cursor-pointer hover:text-amber-200 select-none">📝 스크립트 분석 보기 (${fmtNum(v.views)}회 영상)</summary>
      <div class="mt-2 text-[11px] text-gray-300 space-y-2">
        ${s.intro_hook ? `<div><b class="text-amber-300">인트로 후크 (0~30초)</b><br><span class="text-gray-400">${escape(s.intro_hook)}</span></div>` : ''}
        ${s.structure?.length ? `<div><b class="text-amber-300">구조</b><br>${s.structure.map(st => `<div class="text-gray-400">• ${escape(st)}</div>`).join('')}</div>` : ''}
        ${s.hook_techniques?.length ? `<div><b class="text-amber-300">핵심 후크 단어</b><br><span class="text-gray-400">${s.hook_techniques.map(escape).join(' · ')}</span></div>` : ''}
        ${s.cta ? `<div><b class="text-amber-300">CTA</b><br><span class="text-gray-400">${escape(s.cta)}</span></div>` : ''}
        ${s.why_popular ? `<div><b class="text-amber-300">왜 인기를 끌었나</b><br><span class="text-gray-400">${escape(s.why_popular)}</span></div>` : ''}
        ${s.benchmark_for_hangglwriter ? `<div class="bg-amber-950/30 border border-amber-900/50 rounded p-2"><b class="text-amber-300">💡 행글라이터 벤치마킹</b><br><span class="text-amber-100/90">${escape(s.benchmark_for_hangglwriter)}</span></div>` : ''}
      </div>
    </details>
  `;
}

function escape(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toggleFav(id) {
  if (state.favs.has(id)) state.favs.delete(id);
  else state.favs.add(id);
  localStorage.setItem('thumblab_favs', JSON.stringify([...state.favs]));
  render();
}

// 이벤트 바인딩
document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.getElementById('favOnly').addEventListener('click', e => {
  state.favOnly = !state.favOnly;
  e.target.classList.toggle('bg-amber-500', state.favOnly);
  e.target.classList.toggle('text-gray-900', state.favOnly);
  render();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const k = btn.dataset.key, v = btn.dataset.value;
    state.filters[k] = v;
    document.querySelectorAll(`.filter-btn[data-key="${k}"]`).forEach(b => {
      b.classList.toggle('bg-amber-500', b.dataset.value === v);
      b.classList.toggle('text-gray-900', b.dataset.value === v);
    });
    render();
  });
});

// admin.js 연동
window.thumblabState = state;
window.thumblabRender = render;
window.thumblabReload = () => {
  // 삭제 후 캐시 비우고 현재 보기 갱신
  state.cache = {};
  if (state.activeKeyword) loadKeyword(state.activeKeyword);
  else if (state.activeCategory === '__all_shorts__') loadAllShorts();
  else if (state.activeCategory) loadCategory(state.activeCategory);
};

loadKeywords();
</script>
<script src="admin.js?v=4"></script>

</body>
</html>
